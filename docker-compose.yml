version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: wanderlog_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: wanderlog

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wanderlog_backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/wanderlog
      JWT_SECRET: wanderlog_dev_secret_change_in_prod
      JWT_EXPIRE: 7d
      CLIENT_URL: http://localhost:3000
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_USER: your@gmail.com
      EMAIL_PASS: your_app_password
      OPENWEATHER_API_KEY: your_openweather_key

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wanderlog_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api

volumes:
  mongo_data:
